name: CI

on:
  push:
    branches:
      - main
      - feature/laboratorio-testing-obligatorio
      - feature/laboratorio-testing-opcional
  pull_request:
    branches:
      - main
      - feature/laboratorio-testing-obligatorio

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test -- --run
